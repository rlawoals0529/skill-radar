<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill-radar - see which agent skill actually fires</title>
<meta name="description" content="Load a skills folder, type what a user would say, and see which skills would fire. Runs entirely in your browser. No API key, no server, nothing uploaded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Before first paint, so the page never shows one palette and swaps to another.
     Every palette block in palettes.css declares its own color-scheme, so setting the attribute
     is enough; the module later sets it again through the store, which is a no-op when they
     agree. Wrapped because localStorage throws outright in a private window. */
  (function () {
    var t;
    try { t = localStorage.getItem("skill-radar:theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t || "twilight-comet");
  })();
</script>
</head>
<body class="grain"><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
